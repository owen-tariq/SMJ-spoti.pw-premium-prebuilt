name: Build IPA from your own Spotify IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct link to a decrypted Spotify IPA (leave blank to use IPA_URL secret)"
        required: false
        type: string
      upload_method:
        description: "Where to put the result"
        default: release
        type: choice
        options: [release, artifacts, filebin, all]

env:
  THEOS: ${{ github.workspace }}/theos

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: crack

      - uses: levibostian/action-hide-sensitive-inputs@v1

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: |
          brew install make dpkg ldid
          python3 -m pip install --break-system-packages git+https://github.com/asdfzxcvbn/pyzule-rw.git

      - name: Download IPA
        env:
          INPUT_IPA_URL: ${{ inputs.ipa_url }}
          SECRET_IPA_URL: ${{ secrets.IPA_URL }}
        run: |
          RESOLVED_URL="${INPUT_IPA_URL:-$SECRET_IPA_URL}"
          if [ -z "$RESOLVED_URL" ]; then
            echo "::error::No IPA URL provided. Either pass one as an input or set the IPA_URL repository secret."
            exit 1
          fi
          mkdir -p ipa
          curl -fsSL "$RESOLVED_URL" -o ipa/spotify.ipa
          case "$(file --mime-type -b ipa/spotify.ipa)" in application/zip|application/x-ios-app) ;; *) echo "::error::Not an IPA"; exit 1 ;; esac

      - run: make release

      - name: Get version
        id: version
        run: |
          VERSION=$(cat version.txt | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}-$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Upload to GitHub Release
        if: inputs.upload_method == 'release' || inputs.upload_method == 'all' || inputs.upload_method == ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Spotify++ ${{ steps.version.outputs.tag }}"
          body: |
            Automated build from [spoti.pw](https://github.com/skopevoj/spoti.pw) with custom modifications.
            
            **Built:** ${{ github.run_id }}
            
            > Install via Sideloadly, AltStore, or TrollStore.
          files: out/*.ipa
          prerelease: false
          make_latest: true

      - name: Upload to GitHub Artifacts
        if: inputs.upload_method == 'artifacts' || inputs.upload_method == 'all'
        uses: actions/upload-artifact@v5
        with:
          name: spoti.ipa
          path: out/*.ipa
          if-no-files-found: error

      - name: Upload to filebin.net
        if: inputs.upload_method == 'filebin' || inputs.upload_method == 'all'
        run: |
          BIN="spotifyglass-${{ github.run_id }}"
          echo "### filebin.net download" >> "$GITHUB_STEP_SUMMARY"
          for f in out/*.ipa; do
            curl -fsS -X POST -H "Content-Type: application/octet-stream" --data-binary "@$f" "https://filebin.net/$BIN/$(basename "$f")" >/dev/null
            echo "- https://filebin.net/$BIN/$(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "- _filebin deletes bins after a few days of inactivity, download promptly._" >> "$GITHUB_STEP_SUMMARY"
