name: Auto Sync + Build + Release

# Triggered every 6 hours, or manually.
# Checks if skopevoj/spoti.pw has published a NEW RELEASE.
# If yes: merges the new code (keeping your samj mods), builds the
# .deb tweak AND a patched .ipa, then publishes both to your Releases page.
# The Spotify IPA (stored as IPA_URL secret) stays fixed — only the tweak updates.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build even if already up to date"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────────────────────
  # STEP 1 — Check if the OG repo has a new release
  # ──────────────────────────────────────────────────────────────
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      og_tag:       ${{ steps.check.outputs.og_tag }}
      og_notes:     ${{ steps.check.outputs.og_notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: crack
          token: ${{ secrets.PAT }}

      - name: Check for new OG release
        id: check
        env:
          FORCE: ${{ inputs.force_build }}
        run: |
          # Latest release from the original repo
          OG_TAG=$(curl -sf https://api.github.com/repos/skopevoj/spoti.pw/releases/latest \
                   | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['tag_name'])")
          OG_NOTES=$(curl -sf https://api.github.com/repos/skopevoj/spoti.pw/releases/latest \
                   | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('body','')[:800])")
          echo "og_tag=$OG_TAG" >> $GITHUB_OUTPUT
          # Escape multiline for output
          echo "og_notes<<EOF" >> $GITHUB_OUTPUT
          echo "$OG_NOTES"     >> $GITHUB_OUTPUT
          echo "EOF"           >> $GITHUB_OUTPUT

          # What did we last build?
          LAST=$(cat .last-built-og-tag 2>/dev/null || echo "none")
          echo "OG latest : $OG_TAG"
          echo "Last built: $LAST"

          if [ "$OG_TAG" != "$LAST" ] || [ "$FORCE" = "true" ]; then
            echo "✅ New release detected — will build."
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "⏭ Already up to date. Skipping."
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi

  # ──────────────────────────────────────────────────────────────
  # STEP 2 — Merge OG's new release code into your crack branch
  # (Your samj mods stay — git preserves them on the crack branch)
  # ──────────────────────────────────────────────────────────────
  sync:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout crack branch
        uses: actions/checkout@v4
        with:
          ref: crack
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge OG release into crack (keeps your mods)
        run: |
          git remote add og https://github.com/skopevoj/spoti.pw.git
          git fetch og

          # Merge OG's main (the release tag's code) into crack.
          # Your samj/crack commits stay — git only adds the new OG changes.
          git merge og/main --no-edit || {
            git merge --abort
            echo "::error::Merge conflict with og/main — manual fix needed."
            exit 1
          }
          
          # Merge OG's beta branch because many new features (like Apple Music player) are kept there!
          git merge og/beta --no-edit || {
            git merge --abort
            echo "::error::Merge conflict with og/beta — manual fix needed."
            exit 1
          }

          # Record the OG tag we just merged so we don't rebuild unnecessarily
          # Also forcibly update version.txt to match the OG tag exactly
          echo "${{ needs.check.outputs.og_tag }}" > .last-built-og-tag
          OG_TAG="${{ needs.check.outputs.og_tag }}"
          echo "${OG_TAG#v}" > version.txt
          
          git add .last-built-og-tag version.txt
          git diff --staged --quiet || git commit -m "chore: merged OG ${{ needs.check.outputs.og_tag }} and synced version"
          git push origin crack

  # ──────────────────────────────────────────────────────────────
  # STEP 3 — Build the .deb tweak + patched .ipa, publish both
  # ──────────────────────────────────────────────────────────────
  build:
    needs: [check, sync]
    if: needs.check.outputs.should_build == 'true'
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout crack branch
        uses: actions/checkout@v4
        with:
          ref: crack

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout Theos
        uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install build tools
        run: |
          brew install make dpkg ldid
          python3 -m pip install --break-system-packages \
            git+https://github.com/asdfzxcvbn/pyzule-rw.git

      - name: Download Spotify IPA (fixed version from secret)
        env:
          IPA_URL: ${{ secrets.IPA_URL }}
        run: |
          if [ -z "$IPA_URL" ]; then
            echo "::error::IPA_URL secret is not set."
            exit 1
          fi
          mkdir -p ipa
          curl -fsSL "$IPA_URL" -o ipa/spotify.ipa
          case "$(file --mime-type -b ipa/spotify.ipa)" in
            application/zip|application/x-ios-app)
              echo "✅ IPA downloaded and verified." ;;
            *)
              echo "::error::Downloaded file is not a valid IPA."; exit 1 ;;
          esac

      - name: Restore flag table (if secret set)
        env:
          SG_FLAG_LIST: ${{ secrets.SG_FLAG_LIST }}
        run: |
          if [ -n "$SG_FLAG_LIST" ]; then
            echo "$SG_FLAG_LIST" | base64 -d | gunzip \
              > tweak/Sources/Shared/Flags/SGFlagList.m
            echo "✅ Flag table restored from secret."
          else
            echo "ℹ️ SG_FLAG_LIST not set — will extract from IPA at build time."
          fi

      - name: Build tweak and patched Spotify (produces .deb + .ipa)
        run: make release

      - name: Get version info for release tag
        id: ver
        run: |
          MOD=$(cat version.txt | tr -d '[:space:]')
          APP_DIR=$(unzip -Z1 ipa/spotify.ipa | grep -oE '^Payload/[^/]+\.app/' | head -1)
          SPT=$(unzip -p ipa/spotify.ipa "${APP_DIR}Info.plist" \
                | plutil -extract CFBundleShortVersionString raw -o - -)
          echo "mod=$MOD"   >> $GITHUB_OUTPUT
          echo "spt=$SPT"   >> $GITHUB_OUTPUT
          echo "tag=v${MOD}-spt${SPT}" >> $GITHUB_OUTPUT

      - name: Publish .deb + .ipa to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.PAT }}
          tag_name:   ${{ steps.ver.outputs.tag }}
          name: "Spotify++ v${{ steps.ver.outputs.mod }} (Spotify ${{ steps.ver.outputs.spt }})"
          body: |
            ## Spotify++ v${{ steps.ver.outputs.mod }}

            Automatically built by merging [spoti.pw ${{ needs.check.outputs.og_tag }}](https://github.com/skopevoj/spoti.pw/releases/tag/${{ needs.check.outputs.og_tag }}) with the custom mods from [samj-exe/SMJ-spoti.pw-premium-prebuilt](https://github.com/samj-exe/SMJ-spoti.pw-premium-prebuilt).

            | | |
            |---|---|
            | 🔧 Tweak version | `v${{ steps.ver.outputs.mod }}` |
            | 🎵 Spotify version | `${{ steps.ver.outputs.spt }}` |
            | 🆕 Based on OG | `${{ needs.check.outputs.og_tag }}` |

            ### What's new in the OG update
            ${{ needs.check.outputs.og_notes }}

            ---
            ### How to install
            | File | Method |
            |---|---|
            | `.ipa` | Sideloadly · AltStore · Feather · TrollStore |
            | `.deb` | Sileo · Zebra (jailbroken only) |
          files: |
            out/*.ipa
            tweak/packages/*.deb
          make_latest: true
          prerelease: false
