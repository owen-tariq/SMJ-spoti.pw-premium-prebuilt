name: Build DEB on Push

on:
  push:
    branches: [crack]
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: brew install make dpkg ldid

      - name: Flag table
        env:
          SG_FLAG_LIST: ${{ secrets.SG_FLAG_LIST }}
        run: |
          if [ -z "$SG_FLAG_LIST" ]; then
            echo "Warning: SG_FLAG_LIST secret is not set. The build might fail if it requires this secret."
          else
            echo "$SG_FLAG_LIST" | base64 -d | gunzip > tweak/Sources/Shared/Flags/SGFlagList.m
          fi

      - name: Build
        run: env -u MAKELEVEL gmake -C tweak clean package

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tweak-deb
          path: tweak/packages/*.deb
